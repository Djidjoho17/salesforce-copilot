spring.application.name=copilot

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/salesforce_copilot?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=postgres17
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA settings ? tells Spring how to handle the database tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server runs on port 8080
server.port=8080
anthropic.api.key=YOUR_API_KEY_HERE